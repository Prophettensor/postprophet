# content-agent builder instance — EXAMPLE (copy and edit)
# This ONE file defines "using the product": your connectors, account, and loop.
# The framework (src/postprophet) is shared and unchanged.
#
# MINIMAL MODE (recommended): set loop.derive: true and PostProphet reads your
# vision/positioning/voice from your agent's own memory + the repos you connect.
# You only choose connectors and your account. No need to hand-write vision,
# problem, or voice — the agent already knows them.
#
# No secrets here. Auth (e.g. xurl) is read from your credentials store/env.

name: my-build

# --- connect to your agent stack ---
# Each connector pulls discrete facts ("seeds") from a source in your stack.
# Shipped types: git, github, agent_output, rss, webhook, agent_memory.
# agent_memory reads your agent's own memory files (~/.hermes/memories/,
# ./AGENTS.md, ./CLAUDE.md) — this is the "just connect your agent" entry point.
connectors:
  - name: git
    type: git
    options:
      repos: ["."]              # paths to your repos (feed the idea layer)
  - name: memory
    type: agent_memory          # auto-reads your agent's memory for vision/voice
    options: {}

# --- optional: hand-authored vision (overrides derive mode where set) ---
# If loop.derive is true these are optional — leave blank to auto-derive.
vision:
  positioning: ""               # auto-derived from your READMEs if empty
  audience: []                  # auto-derived from memory if empty
  competitors: []
  problem: ""                   # auto-derived from memory if empty
  market: ""
  avoid: []                     # topics/claims content must never make

# --- optional: voice (derive mode fills from memory, e.g. "no emojis") ---
voice:
  tone: direct
  do_not: []
  max_chars: 280

# --- publishing account ---
account:
  platform: x
  handle: your_handle
  publish_mode: manual          # manual = you post by hand
                                # approve = you approve, then auto-posts
                                # auto = agent posts on schedule

# --- loop tuning ---
loop:
  candidates_per_round: 5
  strategies: []                # empty = use all strategies
  measure_interval_hours: 12    # how often the no_agent cron resolves outcomes
  derive: true                  # derive vision/voice from your agent + repos

