# PostProphet builder instance — EXAMPLE (copy and edit)
#
# The whole point: connect your agent, and it knows what to say and how to say it.
# You do NOT write voice, positioning, or problem statements — the agent already
# has them in its memory and the repos you connect. Config is just: which sources
# to draw from, which account to post to, and (optionally) what to never claim.
#
# No secrets here. Auth (e.g. xurl) is read from your credentials store/env.

name: my-build

# --- connect to your agent stack ---
# Each connector pulls discrete facts ("seeds"). Shipped types:
#   git, github, agent_output, rss, webhook, agent_memory
# agent_memory reads your agent's own memory (MEMORY.md, USER.md, AGENTS.md,
# CLAUDE.md) and supplies the voice/vision the drafting step writes in.
connectors:
  - name: git
    type: git
    options:
      repos: ["."]              # paths to your repos (what you're building)
  - name: memory
    type: agent_memory          # the agent's own voice/vision/memory
    options: {}

# --- publishing account ---
account:
  platform: x
  handle: your_handle
  publish_mode: manual          # manual = you post by hand
                                # approve = you approve, then auto-posts
                                # auto = agent posts on schedule

# --- loop tuning ---
loop:
  candidates_per_round: 5
  strategies: []                # empty = use all strategies
  measure_interval_hours: 12    # how often the no_agent cron resolves outcomes
  derive: true                  # voice/vision come from the agent itself
  # guardrails: things content must NEVER claim or say. This is the only content
  # input you should ever need — it's the negative (safety), not style.
  guardrails:
    - "do not claim reach or engagement guarantees"
    - "do not invent metrics, numbers, or customer quotes"

# --- optional: multi-project (one agent, many products) ---
# Declare each thing you market as a Project. Round with --project NAME.
# Vision comes from each project's own README; voice stays global (the agent's).
projects:
  - name: my-product
    repos:
      - "."
    # agent_outputs:        # optional: other agents feeding THIS project
    # feeds:                # optional: market feeds for this project
