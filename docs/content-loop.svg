<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1040" viewBox="0 0 960 520">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="ah-loop" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a78bfa" />
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#020617"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="480" y="30" fill="white" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" text-anchor="middle">PostProphet Content Loop</text>

  <!-- ── ARROWS (drawn first, behind boxes) ──────────── -->

  <!-- Market Research → Content Agent (straight right, then down) -->
  <path d="M 190 95 L 210 95" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Dev Intelligence → Content Agent (straight right, then up) -->
  <path d="M 190 215 L 210 195" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Content Agent → Revision Loop (straight right) -->
  <path d="M 340 165 L 398 137" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- PostProphet → Content Agent (loop: right arrow, top) -->
  <path d="M 520 130 L 528 130" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ah-loop)"/>

  <!-- Content Agent → PostProphet (loop: left arrow, bottom) -->
  <path d="M 530 145 L 522 145" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ah-loop)"/>

  <!-- Loop exit → Dev Intelligence review (up and right) -->
  <path d="M 660 137 L 700 137 L 700 67 L 718 67" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Dev Intelligence review → Human (straight down) -->
  <path d="M 795 95 L 795 133" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Human → Poster (straight down) -->
  <path d="M 795 185 L 795 223" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- ── ARROW LABELS ──────────────────────────────── -->

  <text x="200" y="85" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">brief</text>
  <text x="200" y="212" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">brief</text>
  <text x="369" y="145" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">drafts</text>
  <text x="525" y="122" fill="#a78bfa" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">eval</text>
  <text x="526" y="158" fill="#a78bfa" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">revise</text>
  <text x="690" y="100" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">best draft</text>
  <text x="810" y="118" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="7">approved</text>
  <text x="810" y="208" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="7">post</text>

  <!-- ── BOXES ─────────────────────────────────────── -->

  <!-- Market Research -->
  <rect x="30" y="60" width="160" height="70" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="30" y="60" width="160" height="70" rx="6" fill="#0f172a" opacity="0.6"/>
  <rect x="30" y="60" width="160" height="70" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="110" y="85" fill="white" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" text-anchor="middle">Market Research</text>
  <text x="110" y="100" fill="#22d3ee" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">Agent</text>
  <text x="110" y="116" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">Voices, themes, competitors</text>

  <!-- Dev Intelligence -->
  <rect x="30" y="180" width="160" height="70" rx="6" fill="#0f172a" opacity="0.6"/>
  <rect x="30" y="180" width="160" height="70" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="110" y="205" fill="white" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" text-anchor="middle">Dev Intelligence</text>
  <text x="110" y="220" fill="#34d399" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">Main Agent</text>
  <text x="110" y="236" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">Git log, Brier, decisions</text>

  <!-- Content Agent (center) -->
  <rect x="210" y="125" width="130" height="70" rx="6" fill="#0f172a" opacity="0.6"/>
  <rect x="210" y="125" width="130" height="70" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="275" y="152" fill="white" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" text-anchor="middle">Content Agent</text>
  <text x="275" y="168" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">Drafts tweets</text>
  <text x="275" y="180" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">from both briefs</text>

  <!-- Revision Loop boundary -->
  <rect x="380" y="95" width="320" height="100" rx="8" fill="rgba(76, 29, 149, 0.06)" stroke="#a78bfa" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="392" y="113" fill="#a78bfa" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600">REVISION LOOP</text>

  <!-- PostProphet -->
  <rect x="400" y="120" width="120" height="60" rx="6" fill="#0f172a" opacity="0.6"/>
  <rect x="400" y="120" width="120" height="60" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="460" y="142" fill="white" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" text-anchor="middle">PostProphet</text>
  <text x="460" y="158" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">Probability</text>
  <text x="460" y="170" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">Scores + feedback</text>

  <!-- Content Agent (reviser) -->
  <rect x="530" y="120" width="120" height="60" rx="6" fill="#0f172a" opacity="0.6"/>
  <rect x="530" y="120" width="120" height="60" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="590" y="142" fill="white" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" text-anchor="middle">Content Agent</text>
  <text x="590" y="158" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">Revises based</text>
  <text x="590" y="170" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">on feedback</text>

  <!-- Loop constraint text (below the boxes, inside loop boundary) -->
  <text x="540" y="185" fill="#a78bfa" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">40% confidence / plateau / max 5 iterations</text>

  <!-- Dev Intelligence (review) -->
  <rect x="720" y="40" width="150" height="55" rx="6" fill="#0f172a" opacity="0.6"/>
  <rect x="720" y="40" width="150" height="55" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="795" y="62" fill="white" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" text-anchor="middle">Dev Intelligence</text>
  <text x="795" y="78" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">Reviews, approves</text>
  <text x="795" y="90" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">or redirects</text>

  <!-- Human -->
  <rect x="720" y="135" width="150" height="50" rx="6" fill="#0f172a" opacity="0.6"/>
  <rect x="720" y="135" width="150" height="50" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="795" y="158" fill="white" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" text-anchor="middle">Human</text>
  <text x="795" y="174" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">Final say</text>

  <!-- Poster -->
  <rect x="720" y="225" width="150" height="50" rx="6" fill="#0f172a" opacity="0.6"/>
  <rect x="720" y="225" width="150" height="50" rx="6" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="795" y="248" fill="white" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" text-anchor="middle">Poster</text>
  <text x="795" y="264" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">Posts to X</text>

  <!-- Legend -->
  <text x="30" y="320" fill="white" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600">Legend</text>

  <rect x="30" y="332" width="16" height="10" rx="2" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="52" y="340" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="8">Research</text>

  <rect x="30" y="348" width="16" height="10" rx="2" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="52" y="356" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="8">Dev Intelligence</text>

  <rect x="30" y="364" width="16" height="10" rx="2" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1"/>
  <text x="52" y="372" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="8">Content Agent</text>

  <rect x="30" y="380" width="16" height="10" rx="2" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1"/>
  <text x="52" y="388" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="8">PostProphet</text>

  <rect x="30" y="396" width="16" height="10" rx="2" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1"/>
  <text x="52" y="404" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="8">Human</text>

  <rect x="30" y="412" width="16" height="10" rx="2" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1"/>
  <text x="52" y="420" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="8">Poster</text>

  <rect x="30" y="428" width="16" height="10" rx="2" fill="transparent" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="52" y="436" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="8">Revision Loop</text>

  <line x1="30" y1="444" x2="46" y2="444" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="52" y="448" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="8">Flow</text>

  <line x1="30" y1="460" x2="46" y2="460" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ah-loop)"/>
  <text x="52" y="464" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="8">Loop</text>
</svg>
