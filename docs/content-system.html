<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PostProphet Content Loop</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'JetBrains Mono',monospace;background:#020617;min-height:100vh;padding:2rem;color:white}
    .container{max-width:1000px;margin:0 auto}
    .header{margin-bottom:2rem}
    .header-row{display:flex;align-items:center;gap:1rem;margin-bottom:0.5rem}
    .pulse-dot{width:12px;height:12px;background:#a78bfa;border-radius:50%;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
    h1{font-size:1.5rem;font-weight:700;letter-spacing:-.025em}
    .subtitle{color:#94a3b8;font-size:.875rem;margin-left:1.75rem}
    .diagram-container{background:rgba(15,23,42,0.5);border-radius:1rem;border:1px solid #1e293b;padding:1.5rem;overflow-x:auto}
    svg{width:100%;min-width:900px;display:block}
    .footer{text-align:center;margin-top:1.5rem;color:#475569;font-size:.75rem}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-row">
        <div class="pulse-dot"></div>
        <h1>PostProphet Content Loop</h1>
      </div>
      <p class="subtitle">Agentic marketing team — research, draft, evaluate, revise, post</p>
    </div>

    <div class="diagram-container">
      <svg viewBox="0 0 960 520">
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
          </marker>
          <marker id="arrowhead-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24" />
          </marker>
          <marker id="arrowhead-loop" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- ── LEFT: Two inputs ─────────────────────────── -->

        <!-- Market Research Agent -->
        <rect x="30" y="60" width="160" height="70" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
        <text x="110" y="85" fill="white" font-size="11" font-weight="600" text-anchor="middle">Market Research</text>
        <text x="110" y="100" fill="#22d3ee" font-size="8" text-anchor="middle">Agent</text>
        <text x="110" y="116" fill="#94a3b8" font-size="8" text-anchor="middle">Voices, themes, competitors</text>

        <!-- Dev Intelligence -->
        <rect x="30" y="180" width="160" height="70" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="110" y="205" fill="white" font-size="11" font-weight="600" text-anchor="middle">Dev Intelligence</text>
        <text x="110" y="220" fill="#34d399" font-size="8" text-anchor="middle">Main Agent</text>
        <text x="110" y="236" fill="#94a3b8" font-size="8" text-anchor="middle">Git log, Brier, decisions</text>

        <!-- Arrows from inputs to content agent -->
        <path d="M 190 95 L 240 95 Q 260 95 260 115 L 260 135" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="215" y="89" fill="#64748b" font-size="8">brief</text>
        
        <path d="M 190 215 L 240 215 Q 260 215 260 195 L 260 175" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="215" y="209" fill="#64748b" font-size="8">brief</text>

        <!-- ── CENTER: Content Agent ─────────────────────── -->

        <rect x="210" y="135" width="130" height="60" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="275" y="160" fill="white" font-size="11" font-weight="600" text-anchor="middle">Content Agent</text>
        <text x="275" y="176" fill="#94a3b8" font-size="8" text-anchor="middle">Drafts tweets</text>
        <text x="275" y="188" fill="#94a3b8" font-size="8" text-anchor="middle">from both briefs</text>

        <!-- Arrow to revision loop -->
        <line x1="340" y1="165" x2="388" y2="165" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead-amber)"/>
        <text x="364" y="159" fill="#64748b" font-size="8" text-anchor="middle">drafts</text>

        <!-- ── REVISION LOOP ─────────────────────────────── -->

        <rect x="380" y="80" width="280" height="170" rx="8" fill="rgba(76, 29, 149, 0.08)" stroke="#a78bfa" stroke-width="1" stroke-dasharray="5,5"/>
        <text x="392" y="98" fill="#a78bfa" font-size="9" font-weight="600">REVISION LOOP</text>

        <!-- PostProphet -->
        <rect x="400" y="110" width="120" height="55" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="460" y="132" fill="white" font-size="11" font-weight="600" text-anchor="middle">PostProphet</text>
        <text x="460" y="148" fill="#94a3b8" font-size="8" text-anchor="middle">Probability</text>
        <text x="460" y="160" fill="#94a3b8" font-size="8" text-anchor="middle">Scores + feedback</text>

        <!-- Content Agent (reviser) -->
        <rect x="530" y="110" width="120" height="55" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="590" y="132" fill="white" font-size="11" font-weight="600" text-anchor="middle">Content Agent</text>
        <text x="590" y="148" fill="#94a3b8" font-size="8" text-anchor="middle">Revises based</text>
        <text x="590" y="160" fill="#94a3b8" font-size="8" text-anchor="middle">on feedback</text>

        <!-- Arrows between PostProphet and Content Agent (bidirectional) -->
        <line x1="520" y1="137" x2="528" y2="137" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead-loop)"/>
        <line x1="530" y1="150" x2="522" y2="150" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead-amber)"/>

        <!-- Loop condition -->
        <text x="520" y="200" fill="#a78bfa" font-size="8" text-anchor="middle">40% confidence / plateau / max 5</text>
        
        <!-- Circular loop arrow -->
        <path d="M 460 165 Q 460 220 590 220 Q 660 220 660 165 L 660 165 Q 660 165 650 165" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowhead-loop)"/>

        <!-- Arrow out of loop -->
        <line x1="520" y1="80" x2="520" y2="60" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="520" y1="60" x2="720" y2="60" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="620" y="54" fill="#64748b" font-size="8">best draft</text>

        <!-- ── RIGHT: Approval chain ─────────────────────── -->

        <!-- Dev Intelligence (review) -->
        <rect x="720" y="40" width="150" height="55" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="795" y="62" fill="white" font-size="11" font-weight="600" text-anchor="middle">Dev Intelligence</text>
        <text x="795" y="78" fill="#94a3b8" font-size="8" text-anchor="middle">Reviews, approves</text>
        <text x="795" y="90" fill="#94a3b8" font-size="8" text-anchor="middle">or redirects</text>

        <!-- Arrow down -->
        <line x1="795" y1="95" x2="795" y2="133" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="810" y="118" fill="#64748b" font-size="8">approved</text>

        <!-- Human -->
        <rect x="720" y="135" width="150" height="50" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="795" y="158" fill="white" font-size="11" font-weight="600" text-anchor="middle">Human</text>
        <text x="795" y="174" fill="#94a3b8" font-size="8" text-anchor="middle">Final say</text>

        <!-- Arrow down -->
        <line x1="795" y1="185" x2="795" y2="223" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="810" y="208" fill="#64748b" font-size="8">post</text>

        <!-- Poster -->
        <rect x="720" y="225" width="150" height="50" rx="6" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
        <text x="795" y="248" fill="white" font-size="11" font-weight="600" text-anchor="middle">Poster</text>
        <text x="795" y="264" fill="#94a3b8" font-size="8" text-anchor="middle">Posts to X</text>

        <!-- ── LEGEND ──────────────────────────────────── -->

        <text x="30" y="350" fill="white" font-size="10" font-weight="600">Legend</text>

        <rect x="30" y="362" width="16" height="10" rx="2" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
        <text x="52" y="370" fill="#94a3b8" font-size="8">Research</text>

        <rect x="30" y="378" width="16" height="10" rx="2" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1"/>
        <text x="52" y="386" fill="#94a3b8" font-size="8">Dev Intelligence</text>

        <rect x="30" y="394" width="16" height="10" rx="2" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1"/>
        <text x="52" y="402" fill="#94a3b8" font-size="8">Content Agent</text>

        <rect x="30" y="410" width="16" height="10" rx="2" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1"/>
        <text x="52" y="418" fill="#94a3b8" font-size="8">PostProphet</text>

        <rect x="30" y="426" width="16" height="10" rx="2" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1"/>
        <text x="52" y="434" fill="#94a3b8" font-size="8">Human</text>

        <rect x="30" y="442" width="16" height="10" rx="2" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1"/>
        <text x="52" y="450" fill="#94a3b8" font-size="8">Poster</text>

        <rect x="30" y="458" width="16" height="10" rx="2" fill="transparent" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="52" y="466" fill="#94a3b8" font-size="8">Revision Loop</text>

      </svg>
    </div>

    <p class="footer">
      PostProphet Content Loop &middot; agentic marketing team
    </p>
  </div>
</body>
</html>
