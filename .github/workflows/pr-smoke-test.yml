name: PR Smoke Test (Stage 1)

on:
  pull_request:
    paths:
      - 'environments/twitter.json'
      - 'postprophet.py'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install httpx openai
      
      - name: Validate config
        id: validate
        run: |
          python -c "
          import json, sys
          
          # Check config is valid JSON
          try:
              with open('environments/twitter.json') as f:
                  env = json.load(f)
          except Exception as e:
              print(f'::error::Config is not valid JSON: {e}')
              sys.exit(1)
          
          # Check structure
          required = ['dimensions', 'probability_guide', 'extra_considerations']
          for key in required:
              if key not in env:
                  print(f'::error::Missing required key: {key}')
                  sys.exit(1)
          
          # Check dimensions
          if not isinstance(env['dimensions'], list) or len(env['dimensions']) == 0:
              print('::error::No dimensions defined')
              sys.exit(1)
          
          # Check each dimension has name + description
          for d in env['dimensions']:
              if 'name' not in d or 'description' not in d:
                  print(f'::error::Dimension missing name/description: {d}')
                  sys.exit(1)
          
          # Token cap: check prompt size
          import os
          sys.path.insert(0, '.')
          os.environ['POSTPROPHET_TEMPERATURE'] = '0'
          from postprophet import build_prompt, load_environment
          prompt = build_prompt(load_environment())
          token_estimate = len(prompt) // 4
          if token_estimate > 10000:
              print(f'::error::Prompt exceeds 10K token cap ({token_estimate} est tokens)')
              sys.exit(1)
          
          print(f'✅ Config valid: {len(env[\"dimensions\"])} dimensions, ~{token_estimate} tokens')
          "
      
      - name: Run Stage 1 eval (historical, temp=0)
        id: eval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POSTPROPHET_TEMPERATURE: '0'
        run: |
          mkdir -p data
          python run_duel.py 2>&1 || true
          
          # Check if results exist
          if [ ! -f data/duel_results.json ]; then
            echo "::error::Eval did not produce results"
            exit 1
          fi
          
          # Extract results
          python -c "
          import json
          with open('data/duel_results.json') as f:
              results = json.load(f)
          
          baseline = results['baseline_brier']
          challenger = results['challenger_brier']
          delta = results['delta']
          rhash = results.get('results_hash', 'unknown')
          
          print(f'BASELINE={baseline}')
          print(f'CHALLENGER={challenger}')
          print(f'DELTA={delta}')
          print(f'HASH={rhash}')
          
          # Set outputs for downstream steps
          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'BASELINE={baseline}\n')
              f.write(f'CHALLENGER={challenger}\n')
              f.write(f'DELTA={delta}\n')
              f.write(f'HASH={rhash}\n')
          
          if delta < -0.05:
              print('::notice::REGRESSION — PR will be auto-closed')
          elif delta > 0.01:
              print('::notice::IMPROVEMENT — PR enters batch queue')
          else:
              print('::notice::WITHIN NOISE — PR enters batch queue')
          "
      
      - name: Comment results on PR + auto-close/label
        if: always() && hashFiles('data/duel_results.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python scripts/post_pr_results.py
