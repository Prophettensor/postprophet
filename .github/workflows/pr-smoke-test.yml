name: PR Smoke Test (Stage 1)

on:
  pull_request:
    paths:
      - 'environments/**'
      - 'approaches/**'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install httpx openai
      
      - name: Structural validation (no historical data needed)
        id: validate
        run: |
          python -c "
          import json, sys, subprocess
          
          # Check if PR modifies protected files
          result = subprocess.run(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'],
              capture_output=True, text=True
          )
          changed_files = result.stdout.strip().split('\n')
          allowed_prefixes = ['environments/', 'approaches/']
          protected = ['data/eval_set.jsonl', 'postprophet.py', 'run_duel.py', 'scripts/', '.github/', 'docs/', 'CONTRIBUTING.md', 'README.md', 'Dockerfile', 'accounts.txt', 'test_mock.py', 'craft.py', 'market_research.py', 'content_team.py', 'generate_dashboard.py']
          for f in changed_files:
              f = f.strip()
              if not f:
                  continue
              is_allowed = any(f.startswith(p) for p in allowed_prefixes)
              if not is_allowed:
                  print(f'::error::PR modifies file outside allowed paths: {f}. Only environments/ and approaches/ changes are allowed.')
                  sys.exit(1)
              for p in protected:
                  if f.startswith(p) or f == p.rstrip('/'):
                      print(f'::error::PR modifies protected file: {f}')
                      sys.exit(1)
          
          # If PR includes approaches/, run security scan
          approach_files = [f for f in changed_files if f.startswith('approaches/') and f.endswith('.py') and not f.endswith('README.py')]
          for af in approach_files:
              with open(af) as f:
                  source = f.read()
              forbidden = ['import postprophet', 'from postprophet', 'eval_set', 'predictions', 'data/eval', 'subprocess', 'os.system', 'exec(', 'eval(', 'open(', 'X_BEARER', 'BEARER_TOKEN', 'os.environ', 'environ']
              for term in forbidden:
                  if term in source:
                      print(f'::error::Security: {af} contains forbidden term: {term}')
                      sys.exit(1)
              if 'def predict_probability' not in source and 'def predict_with_feedback' not in source:
                  print(f'::error::{af} must implement predict_probability or predict_with_feedback')
                  sys.exit(1)
              print(f'Security scan passed: {af}')
          
          # Validate environment config if present
          import os
          for env_file in [f for f in changed_files if f.startswith('environments/') and f.endswith('.json')]:
              try:
                  with open(env_file) as f:
                      env = json.load(f)
                  if 'dimensions' not in env:
                      print(f'::error::{env_file} missing dimensions')
                      sys.exit(1)
                  if 'probability_guide' not in env:
                      print(f'::error::{env_file} missing probability_guide')
                      sys.exit(1)
                  print(f'Config valid: {env_file}')
              except json.JSONDecodeError as e:
                  print(f'::error::{env_file} is not valid JSON: {e}')
                  sys.exit(1)
          
          print('Structural validation passed')
          "
          # Check dimensions
          if not isinstance(env['dimensions'], list) or len(env['dimensions']) == 0:
              print('::error::No dimensions defined')
              sys.exit(1)
          
          for d in env['dimensions']:
              if 'name' not in d or 'description' not in d:
                  print(f'::error::Dimension missing name/description: {d}')
                  sys.exit(1)
          
          # Token cap
          import os
          sys.path.insert(0, '.')
          os.environ['POSTPROPHET_TEMPERATURE'] = '0'
          from postprophet import build_prompt, load_environment
          prompt = build_prompt(load_environment())
          token_estimate = len(prompt) // 4
          if token_estimate > 10000:
              print(f'::error::Prompt exceeds 10K token cap ({token_estimate} est tokens)')
              sys.exit(1)
          
          print(f'Valid config: {len(env[\"dimensions\"])} dimensions, ~{token_estimate} tokens')
          "
      
      - name: Label PR as batch-queued
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          python -c "
          import urllib.request, json, os
          token = os.environ['GITHUB_TOKEN']
          pr = os.environ['PR_NUMBER']
          url = 'https://api.github.com/repos/Prophettensor/postprophet/issues/' + pr + '/labels'
          data = json.dumps({'labels': ['batch-queued']}).encode()
          req = urllib.request.Request(url, data=data, headers={
              'Authorization': f'token {token}',
              'Content-Type': 'application/json'
          })
          urllib.request.urlopen(req)
          print('PR labeled batch-queued')
          "
